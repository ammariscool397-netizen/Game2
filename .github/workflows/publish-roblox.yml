# Builds the place with Rojo and uploads it to your Roblox game with Open Cloud.
#
# One-time setup (see README "Auto-publish to Roblox"):
#   1. Publish the place once from Studio (File > Publish to Roblox) so the game exists.
#   2. Creator Dashboard > Open Cloud > API Keys > Create API Key:
#        Access permissions: "universe-places" (Place Publishing) -> Write, for your experience.
#        IP restrictions: add 0.0.0.0/0 (GitHub runners use changing IPs).
#   3. GitHub repo > Settings > Secrets and variables > Actions:
#        Secret   ROBLOX_API_KEY      = the API key
#        Variable ROBLOX_UNIVERSE_ID  = your experience's Universe ID
#        Variable ROBLOX_PLACE_ID     = your place ID
#
# Every push saves a new version of the place ("Saved" = not live yet, open it in
# Studio to see it). Run the workflow manually with "Published" to make it live.
name: Build & publish to Roblox

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:
    inputs:
      versionType:
        description: "Saved = new version, not live yet. Published = live for players."
        required: true
        default: Saved
        type: choice
        options: [Saved, Published]

jobs:
  # Plays the game headless (tests/sim): a full playthrough, every disaster,
  # duos, admin commands, purchases, saving... Nothing is published unless
  # every scenario passes, with event handlers fired in both orders.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo + Lune
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip
          curl -sSL -o lune.zip https://github.com/lune-org/lune/releases/download/v0.8.9/lune-0.8.9-linux-x86_64.zip
          unzip -o rojo.zip -d "$HOME/bin"
          unzip -o lune.zip -d "$HOME/bin"
          chmod +x "$HOME/bin/rojo" "$HOME/bin/lune"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build place file
        run: rojo build default.project.json -o MegaTycoon.rbxlx

      - name: Type check (luau-lsp)
        run: |
          curl -sSL -o lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.32.1/luau-lsp-linux.zip
          unzip -o lsp.zip -d "$HOME/bin"
          chmod +x "$HOME/bin/luau-lsp"
          curl -sSL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.32.1/scripts/globalTypes.d.luau
          rojo sourcemap default.project.json -o sourcemap.json
          luau-lsp analyze --definitions=globalTypes.d.luau --sourcemap=sourcemap.json --no-strict-dm-types src

      - name: Gameplay simulation tests
        run: lune run tests/sim/run.luau -- MegaTycoon.rbxlx

      - name: Gameplay simulation tests (reversed event order, another seed)
        env:
          SIM_SIGNAL_ORDER: reverse
          SIM_SEED: ${{ github.run_number }}
        run: lune run tests/sim/run.luau -- MegaTycoon.rbxlx

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo
        run: |
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip
          mkdir -p "$HOME/bin"
          unzip -o rojo.zip -d "$HOME/bin"
          chmod +x "$HOME/bin/rojo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build place file
        run: rojo build default.project.json -o MegaTycoon.rbxlx

      - name: Upload place file as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: MegaTycoon-place
          path: MegaTycoon.rbxlx

      - name: Publish to Roblox (Open Cloud)
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
          VERSION_TYPE: ${{ github.event.inputs.versionType || 'Saved' }}
        run: |
          if [ -z "$ROBLOX_API_KEY" ] || [ -z "$UNIVERSE_ID" ] || [ -z "$PLACE_ID" ]; then
            echo "::notice::Roblox publishing is not set up yet (add the ROBLOX_API_KEY secret and the ROBLOX_UNIVERSE_ID / ROBLOX_PLACE_ID variables). The place file was still built and attached as an artifact."
            exit 0
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=${VERSION_TYPE}" \
            -H "x-api-key: ${ROBLOX_API_KEY}" \
            -H "Content-Type: application/xml" \
            --data-binary @MegaTycoon.rbxlx)
          cat response.json; echo
          if [ "$status" -ne 200 ]; then
            echo "::error::Roblox publish failed (HTTP $status). Check the API key permissions, IP restrictions and IDs."
            exit 1
          fi
          echo "::notice::Uploaded to Roblox as a ${VERSION_TYPE} version: $(cat response.json)"
